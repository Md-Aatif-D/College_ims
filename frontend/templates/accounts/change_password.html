{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — IMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="login-body">
<div class="login-bg">
  <div class="login-orb orb-1"></div>
  <div class="login-orb orb-2"></div>
</div>

<div style="position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div class="login-card" style="max-width:420px;width:100%;">
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="font-size:3rem;margin-bottom:0.5rem;">🔒</div>
      <h2 style="font-size:1.75rem;font-weight:700;">Change Password</h2>
      <p style="color:var(--text-muted);font-size:0.9rem;">You must set a new password before continuing.</p>
    </div>

    {% if error %}
    <div class="alert alert-error" style="margin-bottom:1.25rem;"><span>⚠️</span> {{ error }}</div>
    {% endif %}

    <form method="POST" action="/change-password/">
      {% csrf_token %}
      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input type="password" name="new_password" id="new_password" placeholder="Minimum 8 characters" required>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔐</span>
          <input type="password" name="confirm_password" id="confirm_password" placeholder="Repeat password" required>
        </div>
      </div>
      <div id="matchMsg" style="font-size:0.82rem;margin-top:-0.5rem;margin-bottom:1rem;height:1rem;"></div>
      <button type="submit" class="btn-login">🚀 Set New Password</button>
    </form>
  </div>
</div>

<script>
document.getElementById('confirm_password').addEventListener('input', function() {
  const np = document.getElementById('new_password').value;
  const el = document.getElementById('matchMsg');
  if (!this.value) { el.textContent = ''; return; }
  if (this.value === np) {
    el.innerHTML = '<span style="color:var(--accent-green);">✅ Passwords match</span>';
  } else {
    el.innerHTML = '<span style="color:var(--accent-red);">❌ Passwords do not match</span>';
  }
});
</script>
</body>
</html>
